<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contacto</title>

    <style>
    body {
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        background-color: #184d9e;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        margin: 0;
    }

    form {
        background-color: #b73434;
        padding: 30px;
        border-radius: 12px;
        box-shadow: 0 4px 12px rgba(30, 138, 168, 0.1);
        max-width: 452px;
        width: 100%;
        box-sizing: border-box;
    }

    h1 {
        text-align: center;
        color: #0077b6;
        margin-bottom: 25px;
    }

    label {
        display: block;
        margin-top: 15px;
        font-weight: 600;
        color: #333;
    }

    input[type="text"],
    input[type="email"],
    input[type="date"],
    select {
        width: 100%;
        padding: 10px;
        margin-top: 6px;
        border: 1px solid #ccc;
        border-radius: 6px;
        box-sizing: border-box;
    }

    .radio-group {
        margin-top: 5px;
    }

    .radio-group label {
        display: inline-block;
        margin-right: 15px;
        font-weight: normal;
    }

    button {
        margin-top: 25px;
        padding: 12px;
        width: 100%;
        background-color: #0077b6;
        color: white;
        border: none;
        border-radius: 6px;
        font-size: 16px;
        cursor: pointer;
        transition: background-color 0.3s ease;
    }

    button:hover {
        background-color: #005f8a;
    }
    </style>
</head>
<body>
   

    <header style="background-color: rgb(51, 83, 51);">
    <h1>Contacto</h1>
         <p>Esta es una pagina de contacto de mi sitio web</p>
        <nav>
            <ul>
                <li><a href="index.html">Inicio</li>
                <li><a href="Acerca.html">Acerca de</a></li>
                <li><a href="contacto.html">Contacto</a></li>
                <li><a href="registro.html">Registro</a></li>
            </ul>
        </nav>
    </header>

    <main>

        <form action="">
            <h1>Formulario de Registro</h1>
            <label for="nombre">Nombre:</label>
            <input type="text" name="nombre" id="nombre" required placeholder="Escriba aqui"> <br><br>

            <label for="correo">Correo electrónico:</label>
            <input type="email" name="correo" id="correo" required placeholder="Ejemplo@gmail.com"> <br><br>

            <label for="genero">Genero:</label>
            <input type="radio" name="genero" id="masculino" value="masculino">
            <label for="masculino">Masculino</label>
            <input type="radio" name="genero" id="femenino" value="femenino">
            <label for="femenino">Femenino</label>
            <input type="radio" name="genero" id="otro" value="otro">
            <label for="otro">Otro</label> <br><br>

            <label for="pais">Pais </label>
            <select name="pais" id="pais">
                <option value="">Seleccione un pais</option>
                <option value="ecuador">Ecuador</option>
                <option value="colombia">Colombia</option>
                <option value="argentina">Argentina</option>
                <option value="peru">Peru</option>
            </select> <br><br>

            <label for="fechanacimiento">Fecha de nacimiento:</label>
            <input type="date" name="fechanacimiento" id="fechanacimiento"> <br><br>

            <button type="submit">Enviar formulario</button>
        </form>
    </main>

    <footer>
          <p>&copy; Mi sitio web todos los derechos reservados </p>
    </footer>
</body>
</html>
